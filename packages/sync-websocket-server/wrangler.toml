name = "blockexpanse-sync-server"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Each room is a Durable Object instance that holds WebSocket connections
# and an in-memory doc/awareness state for that room.
[[durable_objects.bindings]]
name = "WEBSOCKET_ROOM"
class_name = "WebSocketRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WebSocketRoom"]
